<!doctype html>
<html lang="zh-CN" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<title>音乐播放器</title>
<meta name="description" content="本机音频播放器：把文件加进来，顺序、单曲、随机三种模式，进度与音量留在这一页。">
<meta property="og:title" content="音乐播放器">
<meta property="og:description" content="本机音频播放器：把文件加进来，顺序、单曲、随机三种模式，进度与音量留在这一页。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNWFiOWZjIiBzdHJva2Utd2lkdGg9IjEuNyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJNNCA3aDE2TTQgMTdoMTYiIG9wYWNpdHk9Ii40Ii8+PHBhdGggZD0iTTQgMTJjMi42IDAgMi42LTMgNS4yLTMgczIuNiAzIDUuMiAzIDIuNi0zIDUuNi0zIi8+PC9zdmc+">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body class="app">
  <header class="topbar">
    <div class="wrap topbar-in">
    <a class="skip-link" href="#stage">跳到播放器</a>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16" opacity=".38"/><path class="mark-wave" d="M4 12c2.6 0 2.6-3 5.2-3s2.6 3 5.2 3 2.6-3 5.6-3"/></svg>
    </span>
    <span class="wordmark">音乐播放器</span>
    <span class="stat" id="listen" hidden></span>
    </div>
  </header>

  <main class="stage wrap" id="stage" tabindex="-1">
    <section class="now" aria-label="正在播放">
      <div class="title">
        <h1 id="title">还没有音乐</h1>
        <p class="artist" id="artist"></p>
      </div>

      <canvas class="viz" id="viz" aria-hidden="true"></canvas>

      <div class="controls">
        <div class="seek">
          <input id="seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="播放进度" disabled>
          <div class="times">
            <time id="elapsed">0:00</time>
            <time id="total">0:00</time>
          </div>
        </div>

        <div class="transport">
          <div class="modes" role="group" aria-label="播放模式">
            <button type="button" data-mode="sequence" aria-pressed="true">顺序</button>
            <button type="button" data-mode="single" aria-pressed="false">单曲</button>
            <button type="button" data-mode="random" aria-pressed="false">随机</button>
          </div>

          <div class="buttons">
            <button type="button" class="ic" id="prev" aria-label="上一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5.6v12.8M15 12 5.5 5.4v13.2z"/></svg>
            </button>
            <button type="button" class="play" id="play" aria-label="播放" disabled>
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.2v13.6L19 12z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.4h2.6v13.2H9zM13.4 5.4H16v13.2h-2.6z"/></svg>
            </button>
            <button type="button" class="ic" id="next" aria-label="下一首" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.6v12.8M9 12l9.5-6.6v13.2z"/></svg>
            </button>
          </div>

          <label class="volume" aria-label="音量">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
            <input id="volume" type="range" min="0" max="1" step="0.02" value="0.8">
          </label>
        </div>
      </div>
    </section>

    <section class="library" aria-label="曲库">
      <div class="lib-head">
        <h2>曲库</h2>
        <span class="count" id="count"></span>
        <button type="button" class="pick" id="add">添加文件</button>
      </div>
      <ol class="tracks" id="tracks"></ol>
      <p class="foot" id="hint">文件留在本机，不上传；关掉这一页要重新添加。</p>
      <p class="foot foot--status" id="status" role="status"></p>
    </section>
  </main>

<input type="file" id="picker" accept=".mp3,.m4a,.aac,.flac,.wav,.ogg,.oga,.opus,audio/*" multiple hidden>
<script src="nous-plugin.js"></script>
<script src="app.js"></script>
</body>
</html>
