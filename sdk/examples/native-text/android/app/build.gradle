plugins { id 'com.android.application' }
android {
 namespace 'org.example.text'; compileSdk 35
 defaultConfig { applicationId 'org.example.text.module'; minSdk 30; targetSdk 35; versionCode 1; versionName '1.0.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { java.srcDirs=['../../engine/shared','../../engine/android'] } }
 androidResources { additionalParameters += ['--package-id','0x81','--allow-reserved-package-id'] }
 buildTypes { release { minifyEnabled false } }
}
